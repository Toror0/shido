default_theme: "acta_modern"

themes:
  acta_modern:
    description: "Acta Materialia等の最新論文向け（彩度を抑えた洗練配色）"
    background: "#FFFFFF"
    unit_cell: "#2B2D42"
    subcell_highlight: "#D90429"
    bond: "#B8C0CC"
    silhouette: "#1F2421"
    axes:
      a: "#E63946"
      b: "#2A9D8F"
      c: "#264653"
    elements:
      Ni: "#52B788"
      Mn: "#9B5DE5"
      Ga: "#F4A261"
      In: "#A06CD5"
      Sn: "#6C757D"
      Sb: "#6C757D"
      Fe: "#E07A5F"
      Co: "#3A86FF"
      Ti: "#8D99AE"
      Al: "#90E0EF"
      Cu: "#D4A373"
      O:  "#E63946"
      N:  "#457B9D"
      C:  "#495057"
    fallback_order:
      - "#2A9D8F"
      - "#E9C46A"
      - "#F4A261"
      - "#E76F51"
      - "#8D99AE"
      - "#48CAE4"
      - "#B5179E"
    planes:
      default_opacity: 0.32
      edge_opacity: 0.85
      line_width: 2.0
      palette:
        - fill: "#3A86FF"
          edge: "#1D4ED8"
        - fill: "#FF006E"
          edge: "#BE185D"
        - fill: "#00BBF9"
          edge: "#0284C7"
        - fill: "#FB5607"
          edge: "#C2410C"

