[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shido"
version = "3.0.0"
description = "Shido generates publication-quality crystal structure figures and analyses from CIF files on Windows (GUI / CLI / MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kaito Takeuchi" }]
dependencies = [
    "pymatgen>=2026.10.24,<2027",
    "pyvista>=0.49,<0.50",
    "vtk>=9.7,<9.8",
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "matplotlib>=3.11,<4",
    "pillow>=13.0,<14",
    "pyyaml>=6.0,<7",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
shido = "shido.server:main"

[tool.setuptools.packages.find]
include = ["shido*"]
